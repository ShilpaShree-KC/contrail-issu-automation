# Instances file for ISSU compute upgrade - points computes to nodem29 (master.1310)
# Used by Step 5 - copy into deployer container on noden30
deployment:
    deployer: null
    type:
        kolla:
        contrail:
            branch: 21.4
            registry: registry.contrail.juniper.net/contrail-nightly
    sku: train
    os: ubuntu
    version: master.1310
    orchestrator: openstack

provider_config:
  bms:
    ssh_pwd: c0ntrail123
    ssh_user: root
    ntpserver: 66.129.233.81
    domainsuffix: englab.juniper.net

instances:
  nodem29:
    provider: bms
    ip: 10.204.216.3
    roles:
      config_database:
      config:
      control:
      analytics_database:
      analytics:
      webui:
      analytics_alarm:
      analytics_snmp:

  nodem32:
    provider: bms
    ip: 10.204.216.158
    roles:
      openstack_compute:
      vrouter:
        PHYSICAL_INTERFACE: bond0

  nodem33:
    provider: bms
    ip: 10.204.216.177
    roles:
      openstack_compute:
      vrouter:
        PHYSICAL_INTERFACE: bond0

REGISTRY_PRIVATE_INSECURE: True
CONTAINER_REGISTRY: registry.contrail.juniper.net/contrail-nightly

global_configuration:
  CONTAINER_REGISTRY: registry.contrail.juniper.net/contrail-nightly
  REGISTRY_PRIVATE_INSECURE: True

contrail_configuration:
  CONFIG_API_VIP: 10.204.216.3
  AAA_MODE: rbac
  XMPP_SSL_ENABLE: True
  CLOUD_ORCHESTRATOR: openstack
  OPENSTACK_NODES: 10.204.216.2
  CONTROLLER_NODES: 10.204.216.3
  CONTROL_NODES: 10.10.12.29
  CONTAINER_REGISTRY: registry.contrail.juniper.net/contrail-nightly
  REGISTRY_PRIVATE_INSECURE: True
  CONTRAIL_VERSION: master.1310
  CONTRAIL_CONTAINER_TAG: master.1310
  RABBITMQ_NODE_PORT: 5673
  KEYSTONE_AUTH_HOST: 10.204.216.150
  KEYSTONE_AUTH_ADMIN_PASSWORD: c0ntrail123
  KEYSTONE_AUTH_URL_VERSION: /v3
  VROUTER_GATEWAY: 10.10.12.101
  ENCAP_PRIORITY: "VXLAN,MPLSoUDP,MPLSoGRE"
  CONFIG_NODEMGR__DEFAULTS__minimum_diskGB: "2"
  CONFIG_DATABASE_NODEMGR__DEFAULTS__minimum_diskGB: "2"
  DATABASE_NODEMGR__DEFAULTS__minimum_diskGB: "2"
  API__DEFAULTS__max_request_size: 11124000
  VROUTER_AGENT__DEFAULT__uve_remote_prefix_allow: false
  METADATA_PROXY_SECRET: c0ntrail123

orchestrator_configuration:
  keystone:
    version: v3
    password: c0ntrail123
  internal_vip: 10.204.216.150
  external_vip: 10.204.216.150
  contrail_api_interface_address: 10.204.216.3
  enable_haproxy: "yes"
  enable_ironic: "no"
  enable_swift: "no"

kolla_config:
  kolla_globals:
    kolla_internal_vip_address: 10.204.216.150
    kolla_external_vip_address: 10.204.216.150
    contrail_api_interface_address: 10.204.216.3
    enable_haproxy: "yes"
    enable_ironic: "no"
    enable_swift: "no"
    force_checkout: "no"
    docker_namespace: openstack.kolla
    docker_registry: registry.contrail.juniper.net/quay.io
  kolla_passwords:
    keystone_admin_password: c0ntrail123
    metadata_secret: c0ntrail123

control_data:
    nodem29:
        ip: 10.204.216.3
        ctrldata_ip: 10.10.12.29
        prefix: 24
        gw: 10.10.12.101
        device: eno2
    nodem32:
        ip: 10.204.216.158
        ctrldata_ip: 10.10.12.32
        prefix: 24
        gw: 10.10.12.101
        device: bond0
    nodem33:
        ip: 10.204.216.177
        ctrldata_ip: 10.10.12.33
        prefix: 24
        gw: 10.10.12.101
        device: bond0
